    <style>
        /* Multi-color Mesh Gradient + Crisp Grid Overlay */
        body {
            background-color: #161829;
            background-image: 
                radial-gradient(at 12% 10%, rgba(255, 94, 91, 0.88) 0px, transparent 52%),
                radial-gradient(at 88% 12%, rgba(37, 99, 235, 0.90) 0px, transparent 55%),
                radial-gradient(at 48% 35%, rgba(255, 190, 11, 0.65) 0px, transparent 55%),
                radial-gradient(at 15% 65%, rgba(255, 111, 97, 0.78) 0px, transparent 55%),
                radial-gradient(at 85% 70%, rgba(0, 245, 212, 0.55) 0px, transparent 55%),
                radial-gradient(at 50% 95%, rgba(79, 70, 229, 0.85) 0px, transparent 60%);
            background-attachment: fixed;
            color: #111827;
            overflow-x: hidden;
        }

        .mesh-grid {
            background-size: 46px 46px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
        }

        /* 3D Sticker Bubble Letter Style */
        .bubble-letter {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: #FFFFFF;
            text-shadow: 
                0 5px 0 #CBD5E1,
                0 12px 24px rgba(17, 24, 39, 0.36);
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
        }
        .bubble-letter:hover {
            transform: scale(1.22) rotate(0deg) !important;
            color: #FFBE0B;
        }

        /* Floating Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-13px) rotate(calc(var(--rot, 0deg) + 3deg)); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(11px) rotate(calc(var(--rot, 0deg) - 3deg)); }
        }
        @keyframes swayPolaroid {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-6px); }
        }

        .anim-float-1 { animation: floatSlow 4.8s ease-in-out infinite; }
        .anim-float-2 { animation: floatReverse 5.4s ease-in-out infinite; }
        .anim-float-3 { animation: floatSlow 6.0s ease-in-out 1s infinite; }
        .anim-sway { animation: swayPolaroid 5s ease-in-out infinite; }

        /* Draggable App Sticker */
        .app-sticker {
            box-shadow: 0 16px 32px -6px rgba(0, 0, 0, 0.42), 0 0 0 3px rgba(255, 255, 255, 0.92);
            transition: box-shadow 0.2s ease;
            cursor: grab;
            touch-action: none;
        }
        .app-sticker:active {
            cursor: grabbing;
            box-shadow: 0 22px 40px -4px rgba(0, 0, 0, 0.55), 0 0 0 4px #FFBE0B;
        }

        /* macOS Window Card */
        .mac-window {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border: 2.5px solid #111827;
            box-shadow: 8px 8px 0px #111827;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .mac-window:hover {
            transform: translate(-2px, -2px);
            box-shadow: 11px 11px 0px #111827;
        }

        .stretched-banner {
            letter-spacing: 0.05em;
            transform: scaleY(0.94);
        }

        /* Gallery Marquee */
        @keyframes scrollGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .gallery-track {
            display: flex;
            width: max-content;
            animation: scrollGallery 28s linear infinite;
        }
        .gallery-wrapper:hover .gallery-track {
            animation-play-state: paused;
        }

        /* Live Edit Highlight Indicator */
        body.edit-active [data-editable] {
            outline: 2px dashed #FFBE0B;
            outline-offset: 4px;
            border-radius: 6px;
            cursor: pointer;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #161829; }
        ::-webkit-scrollbar-thumb { background: #FFBE0B; border-radius: 99px; }
    </style>
