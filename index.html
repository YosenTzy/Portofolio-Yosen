<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Glow Web App</title>
  <!-- Menggunakan Font Modern Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(20, 28, 48, 0.65);
      --neon-cyan: #00f2fe;
      --neon-purple: #a855f7;
      --neon-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Cahaya Latar Belakang (Ambient Glow) */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      animation: float 8s infinite alternate ease-in-out;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: var(--neon-purple);
      top: -50px;
      left: -50px;
      opacity: 0.4;
    }
    .orb-2 {
      width: 350px;
      height: 350px;
      background: var(--neon-cyan);
      bottom: -80px;
      right: -50px;
      opacity: 0.35;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Container Utama dengan Efek Glassmorphism & Border Menyala */
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 35px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.1);
    }

    /* Judul dengan Teks Gradasi Menyala */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* Form Input Modern */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--neon-cyan);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    /* Efek Menyala saat Input Diklik */
    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    /* Tombol Neon Menyala */
    .btn-glow {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      transition: all 0.3s ease;
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 0 15px var(--neon-cyan);
    }

    /* Tabel Data Modern */
    .table-wrapper {
      margin-top: 35px;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(0, 242, 254, 0.1);
      color: var(--neon-cyan);
      padding: 14px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body>

  <!-- Bola Cahaya Latar Belakang -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">
    <h1>DASHBOARD DATA</h1>
    <p class="subtitle">Terhubung Langsung dengan Google Sheets</p>

    <!-- Contoh Form Input -->
    <form id="dataForm" onsubmit="kirimData(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama..." required>
      </div>
      <div class="form-group">
        <label>Kategori / Keterangan</label>
        <input type="text" id="keterangan" placeholder="Masukkan keterangan..." required>
      </div>
      <button type="submit" class="btn-glow" id="btnSubmit">Simpan Data</button>
    </form>

    <!-- Contoh Tabel Tampilan Data dari Sheet -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tabelBody">
          <tr>
            <td colspan="3" style="text-align:center; color: var(--text-muted);">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Sesuaikan pemanggilan fungsi ini dengan nama fungsi di Code.gs Anda
    function kirimData(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Menyimpan...';
      btn.disabled = true;

      const nama = document.getElementById('nama').value;
      const keterangan = document.getElementById('keterangan').value;

      // Memanggil fungsi simpanData di Code.gs
      google.script.run
        .withSuccessHandler(function() {
          document.getElementById('dataForm').reset();
          btn.innerText = 'Simpan Data';
          btn.disabled = false;
          muatData(); // Refresh tabel
        })
        .simpanData(nama, keterangan);
    }

    function muatData() {
      // Memanggil fungsi ambilData di Code.gs
      google.script.run
        .withSuccessHandler(function(data) {
          const tbody = document.getElementById('tabelBody');
          tbody.innerHTML = '';
          data.forEach((row, index) => {
            tbody.innerHTML += `
              <tr>
                <td>${index + 1}</td>
                <td>${row[0]}</td>
                <td>${row[1]}</td>
              </tr>
            `;
          });
        })
        .ambilData();
    }

    // Jalankan saat halaman pertama dibuka
    window.onload = muatData;
  </script>
</body>
</html>
